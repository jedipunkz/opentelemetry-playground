services:
  # Go アプリ。OTLP/gRPC で Collector にのみ送る。
  app:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # 0.0〜1.0。0.1 にすると 10% だけサンプルされる。
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      DEPLOYMENT_ENV: local
    depends_on:
      - otel-collector

  # OTTL を使うため contrib ディストリビューションを使う。
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "13133:13133" # health_check
    depends_on:
      - lgtm

  # Grafana + Loki + Tempo + Prometheus を 1 つにまとめた検証用イメージ。
  # OTLP を直接受けられるので、バックエンドごとの設定が不要になる。
  lgtm:
    image: grafana/otel-lgtm:0.33.0
    ports:
      - "3000:3000" # Grafana
